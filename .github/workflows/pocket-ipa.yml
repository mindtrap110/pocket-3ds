name: Pocket 3DS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'codex/**'
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: pocket-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate CI preparation
        run: |
          python3 -m unittest discover -s Scripts/ci -p 'test_*.py'
          bash -n Scripts/BuildSideloadIPA.sh

  build:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 90
    env:
      POCKET_BUNDLE_ID: io.github.mindtrap110.pocket3ds
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
          submodules: recursive
          persist-credentials: false
      - name: Record toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          df -h .
      - name: Build and package device app
        id: ipa
        run: bash Scripts/BuildSideloadIPA.sh
      - name: Downloadable IPA
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pocket-3ds-ipa-${{ github.run_number }}
          path: |
            build/pocket-3ds/Pocket3DS.ipa
            build/pocket-3ds/Pocket3DS.ipa.sha256
            build/pocket-3ds/build-info.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pocket-3ds-logs-${{ github.run_number }}
          path: |
            build/pocket-3ds/*.log
            build/pocket-3ds/build-info.json
          if-no-files-found: ignore
          retention-days: 3
